# Sovereign MyBoudica: a separate, branded Nextcloud for one organisation or
# country site (first use: Bangladesh, next to boudica_slm's
# content/sovereign_ai/bangladesh). Built from ../community, but for adults
# at work, so it keeps what the community instance leaves out:
#   - Talk (chat and calls). Calls use the TURN server of the full MyBoudica
#     on the same box (../collabora's eturnal); there is no separate
#     signaling server, so calls suit small groups.
#   - Sharing, Calendar, Mail (each user connects their own mail account; no
#     mail server here), the Nextcloud dashboard.
#   - Boudica apps: boudicaai, boudicacode, boudicadashboard.
# Its own theme (name, slogan, colour, logo, background) comes from the
# site's settings (setup.sh).
#
# Joins the shared network `boudica_shared`, where a compose service name is
# also a DNS name, so every service here is prefixed `sov-`: one sovereign
# instance per box.
name: myboudica-sovereign

services:
  sov-redis:
    image: redis:latest
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  sov-nextcloud:
    image: git.omniindex.io:5050/omniindex/boudica-collabora/nextcloud:latest
    depends_on: [sov-redis]  # postgres is external/shared (boudica_slm's)
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${SITE_DB_NAME}
      POSTGRES_USER: ${SITE_DB_NAME}
      POSTGRES_PASSWORD: ${SITE_DB_PASSWORD}
      REDIS_HOST: sov-redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${SITE_MY_DOMAIN}
      # SITE_PUBLIC_HOST (setup.sh) is the address as browsers see it: the
      # domain alone on port 443, else domain:port. It has to match the
      # sign-in client's redirect address exactly.
      OVERWRITEHOST: ${SITE_PUBLIC_HOST}
      OVERWRITECLIURL: https://${SITE_PUBLIC_HOST}
      OVERWRITEPROTOCOL: https
    ports:
      - "127.0.0.1:${SITE_NEXTCLOUD_LOCAL_PORT:-8102}:80"
    volumes:
      - nextcloud_data:/var/www/html
      - ../../nextcloud/boudicaai:/var/www/html/custom_apps/boudicaai
      - ../../nextcloud/boudicacode:/var/www/html/custom_apps/boudicacode
      - ../../nextcloud/boudicadashboard:/var/www/html/custom_apps/boudicadashboard
      - ./generated/nextcloud/boudica-csp.conf:/etc/apache2/conf-available/boudica-csp.conf:ro
      - ./generated/theme:/opt/site-theme:ro
    extra_hosts:
      # Nextcloud fetches Collabora's discovery document from its own public
      # address. With a host-level reverse proxy that address is the host.
      - "${SITE_MY_DOMAIN}:${SITE_MY_DOMAIN_IP:-host-gateway}"
    restart: unless-stopped

  sov-nextcloud-cron:
    image: git.omniindex.io:5050/omniindex/boudica-collabora/nextcloud:latest
    depends_on: [sov-redis, sov-nextcloud]
    entrypoint: /bin/sh
    user: www-data
    command: ["-c", "while true; do php /var/www/html/cron.php; sleep 300; done"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${SITE_DB_NAME}
      POSTGRES_USER: ${SITE_DB_NAME}
      POSTGRES_PASSWORD: ${SITE_DB_PASSWORD}
      REDIS_HOST: sov-redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - nextcloud_data:/var/www/html
      - ../../nextcloud/boudicaai:/var/www/html/custom_apps/boudicaai
      - ../../nextcloud/boudicacode:/var/www/html/custom_apps/boudicacode
      - ../../nextcloud/boudicadashboard:/var/www/html/custom_apps/boudicadashboard
    restart: unless-stopped

  sov-collabora:
    image: git.omniindex.io:5050/omniindex/boudica-collabora/collabora:latest
    ports:
      - "127.0.0.1:${SITE_COLLABORA_LOCAL_PORT:-8103}:9980"
    environment:
      aliasgroup1: https://${SITE_PUBLIC_HOST}
      DONT_GEN_SSL_CERT: "true"
      extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:mount_jail_tree=false
      content_security_policy: style-src 'self' 'unsafe-inline';
    depends_on: [sov-nextcloud]
    volumes:
      - ./generated/collabora/boudica-config.js:/usr/share/coolwsd/browser/dist/boudica-config.js:ro
    extra_hosts:
      - "${SITE_MY_DOMAIN}:${SITE_MY_DOMAIN_IP:-host-gateway}"
    restart: unless-stopped

  # This stack's own TLS front door, for a box with no host-level reverse
  # proxy (profile bundled-proxy; setup.sh turns it on). With a host proxy
  # (ts-1's Apache) it never starts, and the proxy points at the loopback
  # ports above.
  sov-nginx:
    image: nginx:latest
    profiles: ["bundled-proxy"]
    depends_on: [sov-nextcloud, sov-collabora]
    volumes:
      - ./generated/nginx:/etc/nginx/conf.d:ro
    ports:
      - "${SITE_HTTPS_PORT:-443}:${SITE_HTTPS_PORT:-443}"
    restart: unless-stopped

networks:
  default:
    name: boudica_shared
    external: true

volumes:
  redis_data:
  nextcloud_data:
