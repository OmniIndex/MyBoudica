# Bundled front door for a community MyBoudica (no host-level reverse proxy).
# Same routes as ../collabora/nginx/default.conf, without Talk and Whiteboard.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen __HTTPS_PORT__ ssl;
    server_name __DOMAIN__;
    ssl_certificate     /etc/nginx/conf.d/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/privkey.pem;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 512M;
    location ~ ^/cool/(.*)/ws$ {
        set $collabora_upstream http://community-collabora:9980;
        proxy_pass $collabora_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location ~ ^/(browser|hosting/discovery|hosting/capabilities|cool) {
        set $collabora_upstream http://community-collabora:9980;
        proxy_pass $collabora_upstream;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # The AI helper's and the coding assistant's calls. __API_UPSTREAM__ is
    # the community service's guarded route, not Boudica's API directly.
    location /api/boudica/ {
        set $boudica_api_upstream __API_UPSTREAM__;
        proxy_pass $boudica_api_upstream;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ~ ^/boudica-static/(?<boudica_static_path>.*)$ {
        set $boudica_web_upstream http://web:80/$boudica_static_path;
        proxy_pass $boudica_web_upstream;
        proxy_set_header Host $host:$server_port;
    }
    location / {
        set $nextcloud_upstream http://community-nextcloud:80;
        proxy_pass $nextcloud_upstream;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
