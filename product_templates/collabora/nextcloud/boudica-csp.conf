# Allows the Boudica apps' direct browser-to-inference-server fetches
# through Nextcloud's default CSP. __BOUDICA_API_ORIGIN__ is substituted by
# setup.sh from whatever BOUDICA_API_ENDPOINT resolves to - by default now
# the co-located boudica_slm instance on this SAME domain (nginx proxies
# /api/boudica/ to it), in which case this ends up identical to Nextcloud's
# own origin and 'self' below already covers it (a harmless no-op
# duplicate, not worth conditionalizing away). Still needed for real
# cross-origin cases: an admin who points BOUDICA_API_ENDPOINT at a
# genuinely external/split-out inference server instead.
<IfModule mod_headers.c>
    Header edit Content-Security-Policy "connect-src [^;]*" "connect-src 'self' wss: __BOUDICA_API_ORIGIN__"
    Header edit Content-Security-Policy "script-src 'self'" "script-src 'self' __BOUDICA_API_ORIGIN__"
    Header edit Content-Security-Policy "default-src 'self'" "default-src 'self' __BOUDICA_API_ORIGIN__"
</IfModule>
