# Real, currently-live Apache vhost from ts-1-boudica (boudica.myboudica.com)
# - captured here 2026-09-11 as a reference/backup. This is the
# "external-proxy" deployment mode the main README describes ("a
# host-level reverse proxy already fronts this domain"): host Apache
# terminates TLS and proxies to this stack's own loopback-bound services
# (Nextcloud :8082, Collabora :8083, boudica_slm's web :8080/8081) instead
# of using this stack's own bundled nginx. Was never checked into any repo
# before this - it only existed live on ts-1-boudica, edited by hand during
# the original MyBoudica cutover. Not consumed by setup.sh or any other
# automation; this mode still requires manually configuring the host proxy
# yourself, this file is just a known-working starting point/reference for
# that, not something to symlink or copy in verbatim without adjusting
# paths/domain for a new box.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName boudica.myboudica.com

    # AllowEncodedSlashes NoDecode (2026-09-11): Collabora insert-local-file
    # POSTs to /cool/<url-encoded WOPISrc, containing %2F for every slash>/insertfile
    # - Apache 404s any request path containing an encoded slash unless this
    # is set (default is Off). NoDecode (not On) keeps the %2F sequences
    # encoded when forwarding to the collabora backend via ProxyPass, which
    # is what mod_proxy needs here - coolwsd expects to decode the WOPISrc
    # itself, not receive an already-decoded path. Confirmed live: this was
    # silently breaking every local file/image insert into a document with
    # a plain Apache 404 page (not a coolwsd error), while the same request
    # succeeded fine through nginx-fronted deployments, which has no such
    # restriction by default.
    AllowEncodedSlashes NoDecode

    ProxyPreserveHost On
    ProxyRequests Off

    # mod_proxy tries ProxyPass directives in the order they appear (not by
    # specificity) - every more-specific path below MUST come before the
    # catch-all / at the bottom, or it would never be reached.
    #
    # Keycloak (KC_HTTP_RELATIVE_PATH=/kc, see product_templates/multiuser/
    # docker-compose.yml) is reverse-proxied here instead of exposed on its
    # own port 8081 - that would mean the login form POST travels over
    # plain HTTP (the keycloak container has no TLS of its own), sending
    # credentials over the open internet unencrypted. No path rewriting
    # (both sides use /kc) since Keycloak's own relative-path config
    # already makes it generate/expect links under /kc.
    ProxyPass /kc http://127.0.0.1:8081/kc
    ProxyPassReverse /kc http://127.0.0.1:8081/kc

    # Collabora WOPI/discovery/browser assets - MyBoudica's document editor,
    # reached via a path on this same domain rather than its own subdomain
    # (see project-myboudica-integration-plan-20260905 Phase 1). The
    # WebSocket-specific /cool/.../ws path and the general Collabora paths
    # both go to the same loopback port (8083, published by the collabora
    # service in product_templates/collabora/docker-compose.yml) -
    # "upgrade=websocket" (Apache 2.4.47+, needs mod_proxy_wstunnel) lets
    # ProxyPass handle a real document-editing WebSocket session and a
    # plain HTTP request on the exact same directive, matching what the
    # dev-box build's nginx config needed two separate location blocks for.
    ProxyPass /cool/ http://127.0.0.1:8083/cool/ upgrade=websocket timeout=3600
    ProxyPassReverse /cool/ http://127.0.0.1:8083/cool/
    ProxyPass /browser http://127.0.0.1:8083/browser
    ProxyPassReverse /browser http://127.0.0.1:8083/browser
    ProxyPass /hosting/discovery http://127.0.0.1:8083/hosting/discovery
    ProxyPassReverse /hosting/discovery http://127.0.0.1:8083/hosting/discovery
    ProxyPass /hosting/capabilities http://127.0.0.1:8083/hosting/capabilities
    ProxyPassReverse /hosting/capabilities http://127.0.0.1:8083/hosting/capabilities

    # Boudica inference API (boudica_slm's own `web` service, port 8080) -
    # the four Boudica Nextcloud apps' own calls (and any direct API caller
    # hitting this domain) still need to reach this directly, now that /
    # below serves Nextcloud instead of this same backend. Streamed chat
    # responses must not sit in a buffer waiting to fill, matching the
    # dev-box nginx config's own proxy_buffering off for this same path.
    ProxyPass /api/boudica/ http://127.0.0.1:8080/api/boudica/ flushpackets=on
    ProxyPassReverse /api/boudica/ http://127.0.0.1:8080/api/boudica/

    # boudicaai's Knowledge Base File Manager iframes file_manager.html
    # unmodified from boudica_slm's own web root - proxying the whole
    # prefix serves it and its own relative asset references (scripts/,
    # css/) correctly with one rule. Apache's ProxyPass strips the matched
    # prefix by default (unlike nginx, which needed an explicit regex
    # capture for this same thing), so this maps
    # /boudica-static/scripts/file-manager.js -> :8080/scripts/file-manager.js
    # directly.
    ProxyPass /boudica-static/ http://127.0.0.1:8080/
    ProxyPassReverse /boudica-static/ http://127.0.0.1:8080/

    # file-manager.js's own API calls are a fixed, hardcoded absolute path,
    # not under /api/boudica/ or relative to /boudica-static/.
    ProxyPass /cgi-bin/rag_upload http://127.0.0.1:8080/cgi-bin/rag_upload
    ProxyPassReverse /cgi-bin/rag_upload http://127.0.0.1:8080/cgi-bin/rag_upload

    # Nextcloud - now the front door for this domain (was boudica_slm's own
    # chat_interface directly - that's still served, completely unchanged,
    # at boudi.ca).
    ProxyPass / http://127.0.0.1:8082/
    ProxyPassReverse / http://127.0.0.1:8082/

    # mod_proxy_http sets X-Forwarded-For/Host/Server automatically but NOT
    # X-Forwarded-Proto - without this, Keycloak's KC_PROXY_HEADERS=xforwarded
    # can't tell the original request was https (this container only ever
    # sees plain http from Apache), and would generate http:// links/redirect
    # loops despite the browser being on https.
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/boudica_proxy_error.log
    CustomLog ${APACHE_LOG_DIR}/boudica_proxy_access.log combined

SSLCertificateFile /etc/letsencrypt/live/boudica.myboudica.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/boudica.myboudica.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
