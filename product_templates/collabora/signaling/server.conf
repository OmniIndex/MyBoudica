## nextcloud-spreed-signaling config. Section/key names below are exactly
## as documented in RUNBOOK.md 4.1 - several are one typo away from a
## silent-failure config that "looks right": [sessions] not [session],
## skipverify not verify, servers not apis (in [turn]), secret not
## apisecret, urls not url (in [backend]). Do not "fix" these to look more
## consistent - they're already correct for this version.

[http]
listen = 0.0.0.0:8081

[sessions]
hashkey = __SESSIONS_HASHKEY__

[backend]
# "allowed" is NOT a real key for the deployed signaling server binary -
# confirmed against its own bundled server.conf.in, which only supports
# "backends"/per-id sections or "allowall". The old "allowed" key was
# silently ignored by the Go ini parser, leaving zero backends registered
# as trusted - every real Nextcloud backend request (which always sends a
# Spreed-Signaling-Backend header) got rejected with a 403 "Authentication
# check failed" regardless of a correct HMAC checksum, even though a
# hand-crafted request omitting that header passed fine. Confirmed live
# 2026-09-08 via a controlled HMAC replay test (see
# project-myboudica-integration-plan-20260905.md) - this superseded an
# earlier, incomplete 2026-09-05 theory that the problem was just a
# missing port on this same line. allowall=true is correct for this
# single-tenant/single-Nextcloud-instance deployment - the shared secret
# HMAC check below still fully applies, allowall only skips a
# per-backend-domain lookup that has no purpose with one backend.
allowall = true
secret = __TALK_BACKEND_SECRET__
# true because setup.sh's own default is a self-signed cert (see its TLS
# generation step) - Go's HTTP client does real cert-chain validation with
# no way to click through it like a browser can, so calling back to
# Nextcloud over HTTPS (e.g. for /ocs/v2.php/cloud/capabilities) fails
# outright ("x509: certificate signed by unknown authority") against that
# self-signed cert with this at false, breaking the realtime WebSocket
# connection in a permanent reconnect loop ("Failed to connect. The
# signalling server maybe setup incorrectly." toast) - confirmed live
# 2026-09-05 on a local/trial deployment with no external exposure, same
# tradeoff already made deliberately for occ talk:signaling:add's own
# missing --verify flag above. A deployment that drops in a real CA-signed
# cert instead can set this back to false for full verification.
skipverify = true

[turn]
servers = turn:__TURN_HOST__:3478?transport=udp,turn:__TURN_HOST__:3478?transport=tcp
apikey = signaling
secret = __TURN_SHARED_SECRET__

## Processes NATS messages internally instead of connecting to a real NATS
## server - correct for a single signaling instance (this stack's default
## tier). A multi-instance/clustered deployment (not this stack, yet) would
## need a real external NATS url here instead. Without this section at all,
## this build tries (and fails) to reach a NATS server, unlike an older
## signaling binary version that apparently defaults to loopback behavior
## silently - RUNBOOK.md's native eu1 config has no [nats] section at all,
## which is why a live nats-server process was found running there but
## seemingly unreferenced.
[nats]
url = nats://loopback

[mcu]
type = janus
url = ws://janus:8188

[rooms]
