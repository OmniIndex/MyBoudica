# Consolidates what previously ran as 3 separate vhosts on a standalone
# reverse-proxy box (RUNBOOK.md) into one compose-managed nginx. Keeps the
# same subdomain layout (main / talk. / whiteboard.) so existing DNS records
# for a migrated deployment don't need to change - point all three A-records
# at this box instead of the old proxy box's IP.
#
# TLS certs are a sysadmin step (see README.md), not baked into any image -
# this expects fullchain.pem/privkey.pem for each of the 3 names under
# /etc/nginx/certs/<name>/. __BOUDICA_DOMAIN__/__BOUDICA_HTTP_PORT__/
# __BOUDICA_HTTPS_PORT__ substituted by setup.sh.
#
# Listens on the configured ports explicitly (not hardcoded 80/443) because
# docker-compose.yml publishes this container's ports as
# "<port>:<same port>", not the usual "<hostport>:<containerport>"
# translation - Nextcloud Talk's own admin-panel "High-performance backend"
# check connects to this nginx from *inside* the Docker network (from the
# nextcloud container), where only this container's own real listening
# port exists at all - confirmed live that a mismatched port here breaks
# that check even once DNS resolution itself was fixed via network aliases.
# Harmless for the standard 80/443 case too - nothing changes there.
#
# Every proxied Host header below uses $host:$server_port, NOT bare $host -
# nginx's $host strips any port from the client's original request
# entirely. Confirmed live this broke Collabora specifically: it reflects
# whatever Host header it receives back into its own /hosting/discovery
# response (the urlsrc Nextcloud's richdocuments then tells the browser to
# load the editor from), so a port-less forwarded Host silently produced a
# port-less discovery URL downstream, well after every other port-handling
# fix in this file - same underlying nginx behavior as the plain-HTTP
# redirect above, just surfacing through a completely different symptom
# ("browser unable to connect to the Collabora server") several fixes
# later. $server_port is the port nginx itself accepted the connection on,
# which is correct here specifically because docker-compose.yml publishes
# this container on the SAME port internally and externally (see above) -
# don't reintroduce a hostport:containerport translation without revisiting
# this.
#
# EVERY proxy_pass below uses a variable, NOT a bare static
# "http://name:port" - a static hostname gets resolved ONCE, at nginx's own
# startup/config-load time, and nginx refuses to even start at all
# ("host not found in upstream") if that name isn't resolvable at that
# exact moment. Confirmed live this crash-looped nginx repeatedly right
# after wiring the new /api/boudica upstream (a service in a completely
# separate `docker compose` project, boudica_slm's own multiuser stack -
# no guaranteed start-order relative to this one at all) - and once one
# static upstream was flaky, a second recreate cycle then failed to
# resolve "collabora" too (a service in THIS SAME project), same
# mechanism, just a different sibling container not up yet at that exact
# instant. A variable forces nginx to defer resolution to request time via
# the `resolver` directive (Docker's embedded DNS at 127.0.0.11), so an
# upstream that isn't ready yet just fails that one request instead of
# preventing nginx from starting at all, and correctly picks up a
# container's new IP after any future restart/recreate too.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen __BOUDICA_HTTP_PORT__;
    server_name __BOUDICA_DOMAIN__ talk.__BOUDICA_DOMAIN__ whiteboard.__BOUDICA_DOMAIN__;
    location / { return 301 https://$host:__BOUDICA_HTTPS_PORT__$request_uri; }
}

server {
    listen __BOUDICA_HTTPS_PORT__ ssl;
    server_name __BOUDICA_DOMAIN__;
    ssl_certificate     /etc/nginx/certs/__BOUDICA_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/__BOUDICA_DOMAIN__/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    client_max_body_size 512M;

    # Collabora WOPI/discovery/browser assets - routed to the collabora
    # service before the catch-all Nextcloud location, matching how Apache
    # split these on eu1 (RUNBOOK.md).
    #
    # ORDER MATTERS: nginx picks the FIRST matching regex location in
    # declaration order, not the most specific one (unlike prefix
    # locations) - the WebSocket-specific /cool/.../ws block MUST come
    # before the general /cool prefix-ish regex below, or every document
    # editing session's WebSocket upgrade falls into the general block
    # (no Upgrade/Connection headers) and gets a plain 400 back instead of
    # a 101 - confirmed live exactly this way ("Failed to establish socket
    # connection" in the Collabora editor).
    location ~ ^/cool/(.*)/ws$ {
        set $collabora_upstream http://collabora:9980;
        proxy_pass $collabora_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(browser|hosting/discovery|hosting/capabilities|cool) {
        set $collabora_upstream http://collabora:9980;
        proxy_pass $collabora_upstream;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # boudica_slm's own web/CGI frontend (product_templates/multiuser's
    # `web` service) - reachable here because both stacks share the
    # `boudica_shared` Docker network (see the top-level `networks:` block
    # below). This makes Nextcloud the single front door for the whole
    # system: the four Boudica apps' default API endpoint is this
    # same-domain path now, not the external boudi.ca SaaS - see
    # boudicaai/lib/Settings/AdminSettings.php and setup.sh.
    # proxy_buffering off + a long read timeout, matching the WebSocket
    # blocks above - chat responses stream token-by-token and must not sit
    # in an nginx buffer waiting to fill before the browser sees anything.
    location /api/boudica/ {
        set $boudica_web_upstream http://web:80;
        proxy_pass $boudica_web_upstream;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # The ported Knowledge Base File Manager (boudicaai/js/file-manager-window.js)
    # iframes file_manager.html unmodified from boudica_slm's own web root
    # (content/interfaces/html/chat_interface/ - the same static tree the
    # standalone chat app itself is) rather than copying it into this app -
    # file_manager.html's own <script src="scripts/file-manager.js"> and
    # similar relative asset references resolve against whatever URL the
    # iframe loaded, so proxying the whole root under one prefix serves
    # them all correctly with a single location, not one per asset.
    # A regex location capturing the sub-path into a named variable, NOT a
    # plain-prefix location + rewrite...break - both were tried live and
    # only this one actually works. Two real, non-obvious gotchas found
    # getting here:
    #   1. When proxy_pass's target is a VARIABLE (required everywhere in
    #      this file so nginx defers DNS resolution to request time instead
    #      of failing to start - see the top of this file), nginx does NOT
    #      strip the matched location prefix the way it does for a static
    #      proxy_pass target - it forwards the untouched, full original
    #      URI. Confirmed live: with a plain `location /boudica-static/`
    #      and no rewrite, Apache received the literal path
    #      "/boudica-static/scripts/file-manager.js", found no such file,
    #      and (via some Apache-side fallback) silently returned
    #      index.html's content with a 200 instead of a 404 - the failure
    #      was invisible without inspecting Content-Length/Last-Modified,
    #      not an obvious connection error.
    #   2. The seemingly-correct standard fix, `rewrite ^/boudica-static/
    #      (.*)$ /$1 break;` followed by the same variable-based
    #      proxy_pass, does NOT work either - confirmed live it made nginx
    #      return a bare "404 Not Found" for EVERY request under this
    #      prefix, even though `nginx -t` passed and the location block was
    #      verified byte-for-byte correct and properly nested (checked via
    #      `cat -A` inside the running container) - `break` interacts badly
    #      with this variable-proxy_pass pattern specifically, for reasons
    #      not fully root-caused. Isolated via a temporary `return 200
    #      "uri=$uri"` in place of the real proxy_pass: removing just the
    #      `rewrite` line made the location match and return correctly,
    #      proving the location itself was never the problem.
    # The regex-capture form below sidesteps both issues entirely - the
    # variable is built directly from the capture group, no separate
    # rewrite step needed.
    location ~ ^/boudica-static/(?<boudica_static_path>.*)$ {
        set $boudica_web_upstream http://web:80/$boudica_static_path;
        proxy_pass $boudica_web_upstream;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # file-manager.js's own API calls are an absolute /cgi-bin/rag_upload
    # path (not under /api/boudica/, and not relative to /boudica-static/
    # either - it's a fixed, hardcoded path in the source), so it needs its
    # own exact-match location rather than being covered by the block above.
    location = /cgi-bin/rag_upload {
        set $boudica_web_upstream http://web:80;
        proxy_pass $boudica_web_upstream;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Generated images (FLUX): the inference server answers an image request
    # with a markdown image whose URL is the RELATIVE path /generated/<id>.png,
    # which boudicaai's chat UI renders as-is, so the browser resolves it
    # against this (Nextcloud) origin - without this block it falls through to
    # Nextcloud and 404s. boudica_slm's web container proxies /generated on to
    # its flux sidecar. A plain prefix location is right here (unlike
    # /boudica-static/ above): the path must reach `web` UNCHANGED, and a
    # variable proxy_pass target forwards the full original URI.
    location /generated/ {
        set $boudica_web_upstream http://web:80;
        proxy_pass $boudica_web_upstream;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $nextcloud_upstream http://nextcloud:80;
        proxy_pass $nextcloud_upstream;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen __BOUDICA_HTTPS_PORT__ ssl;
    server_name talk.__BOUDICA_DOMAIN__;
    ssl_certificate     /etc/nginx/certs/talk.__BOUDICA_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/talk.__BOUDICA_DOMAIN__/privkey.pem;

    resolver 127.0.0.11 valid=10s;

    # WebSocket-critical - signaling drops otherwise. proxy_buffering off and
    # a long read timeout match the proven-live config exactly.
    location / {
        set $signaling_upstream http://signaling:8081;
        proxy_pass $signaling_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen __BOUDICA_HTTPS_PORT__ ssl;
    server_name whiteboard.__BOUDICA_DOMAIN__;
    ssl_certificate     /etc/nginx/certs/whiteboard.__BOUDICA_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/whiteboard.__BOUDICA_DOMAIN__/privkey.pem;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $whiteboard_upstream http://whiteboard:3002;
        proxy_pass $whiteboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
