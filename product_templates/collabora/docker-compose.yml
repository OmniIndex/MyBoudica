##
## Boudica-Nextcloud-Collabora integration stack (Talk, Files, own UI).
## Containerizes what previously ran hand-built across 6 servers (see
## RUNBOOK.md) - single box for a sovereign/on-prem trial by default;
## a sysadmin splits pieces onto separate boxes for a medium/large
## deployment by pointing the relevant env vars at externally-hosted
## instances instead (see README.md), no code changes needed either way.
##
## Run from this directory (./setup.sh first) so container/volume names are
## namespaced automatically, or pass -p explicitly:
##   docker compose -p boudica-collabora up -d
##
services:
  # No postgres service here - shares boudica_slm's own instance (service
  # name `postgres`, reachable via the `boudica_shared` external network)
  # instead of running a second one. The `nextcloud` database/role in that
  # shared instance is created by setup.sh at install time (idempotent
  # `docker exec` against the running container), not a postgres-init
  # script - install order between the two products isn't guaranteed, and
  # /docker-entrypoint-initdb.d scripts only ever run once against a truly
  # empty data directory.

  redis:
    image: redis:latest
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nextcloud:
    image: git.omniindex.io:5050/omniindex/boudica-collabora/nextcloud:latest
    build:
      context: ./nextcloud
      args:
        NEXTCLOUD_VERSION: ${NEXTCLOUD_VERSION:-34.0.2}
    depends_on: [redis]  # postgres is external/shared - see the boudica_shared network note above
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${BOUDICA_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${BOUDICA_DOMAIN}
      # Always carries the port explicitly, even the standard 443 - harmless
      # (https://x:443/ and https://x/ are identical to a browser) but
      # necessary for a non-standard port like the 8443 this test box uses
      # to avoid a port conflict. Without this, Nextcloud has no way to
      # know the real external port - nginx's $host variable (used for the
      # Host header it forwards) strips the port from what the browser
      # actually sent, so Nextcloud silently defaults to 443 and every
      # generated redirect/login URL comes back missing the real port.
      OVERWRITEHOST: ${BOUDICA_DOMAIN}:${BOUDICA_HTTPS_PORT:-443}
      OVERWRITECLIURL: https://${BOUDICA_DOMAIN}:${BOUDICA_HTTPS_PORT:-443}
      OVERWRITEPROTOCOL: https
      # Talk's own MCU/signaling wiring - read by Nextcloud's Talk admin
      # settings (occ talk:* / the admin UI) at first boot via
      # generated/nextcloud/talk-config.sh, not by the base image directly.
      TALK_SIGNALING_HOST: https://talk.${BOUDICA_DOMAIN}
      TALK_SIGNALING_SECRET: ${TALK_BACKEND_SECRET}
    # Loopback-only, always published regardless of proxy mode - see the
    # nginx service's own comment below for why this exists alongside (not
    # instead of) the bundled-nginx routing.
    ports:
      - "127.0.0.1:${BOUDICA_NEXTCLOUD_LOCAL_PORT:-8082}:80"
    volumes:
      - nextcloud_data:/var/www/html
      # Custom apps mounted individually (not baked into the image) so
      # `occ app:enable`/app updates work normally without an image rebuild.
      - ../../nextcloud/boudicaai:/var/www/html/custom_apps/boudicaai
      - ../../nextcloud/boudicaagent:/var/www/html/custom_apps/boudicaagent
      - ../../nextcloud/boudicacode:/var/www/html/custom_apps/boudicacode
      - ../../nextcloud/boudicadashboard:/var/www/html/custom_apps/boudicadashboard
      # janus-pp-rec's output (boudicaai's JanusRecordingMonitor.php scans
      # this path) - shared with the janus service below.
      - janus_recordings:/mnt/janus-recordings:ro
      - ./generated/nextcloud/boudica-csp.conf:/etc/apache2/conf-available/boudica-csp.conf:ro
      # Prototype 2026-09-09: exposes the multiuser stack's shared RAG
      # corpus root (product_templates/multiuser's BOUDICA_MULTIUSER_CORPUS_DIR,
      # host default /var/boudica/corpus_multiuser) so Nextcloud's
      # files_external (External Storage) app can mount a user's own
      # users/<email>/public/ subfolder as a folder inside their account -
      # files they save there land directly in the same path
      # inference_server.cpp's match_on:"user_id" domain_routing rule
      # (rag_source_url_prefix_template: "users/{user_id}/") already routes
      # their own RAG queries to, and rag-watcher already watches
      # recursively. rw (not ro) since the whole point is letting users
      # write into it via Nextcloud. Not yet wired per-user automatically
      # at Nextcloud registration time - configured manually per user via
      # occ files_external:create for now.
      - /var/boudica/corpus_multiuser:/mnt/boudica_corpus
    restart: unless-stopped

  nextcloud-cron:
    image: git.omniindex.io:5050/omniindex/boudica-collabora/nextcloud:latest
    build:
      context: ./nextcloud
      args:
        NEXTCLOUD_VERSION: ${NEXTCLOUD_VERSION:-34.0.2}
    depends_on: [redis, nextcloud]  # postgres is external/shared
    entrypoint: /bin/sh
    # Nextcloud's background-jobs system (occ, cron.php) has no internal
    # scheduler of its own - boudicaai's DigestPollJob (5-minute interval)
    # does not run at all without something invoking cron.php periodically.
    #
    # user: www-data is required, not cosmetic - cron.php refuses to run as
    # any other user ("Console has to be executed with the user that owns
    # the file config/config.php"), confirmed live: without this, the
    # digest job silently failed every single run, every 5 minutes.
    user: www-data
    command: ["-c", "while true; do php /var/www/html/cron.php; sleep 300; done"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${BOUDICA_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - nextcloud_data:/var/www/html
      - ../../nextcloud/boudicaai:/var/www/html/custom_apps/boudicaai
      - ../../nextcloud/boudicaagent:/var/www/html/custom_apps/boudicaagent
      - ../../nextcloud/boudicacode:/var/www/html/custom_apps/boudicacode
      - ../../nextcloud/boudicadashboard:/var/www/html/custom_apps/boudicadashboard
      # JanusTranscribeJob (boudicaai background job, runs via this
      # container's cron.php loop) needs the same recordings mount the
      # main nextcloud service has - without it, /mnt/janus-recordings
      # doesn't exist here at all and every 5-minute run silently finds
      # nothing to transcribe. Found while verifying the automatic
      # call-transcription flow end-to-end, 2026-09-05.
      - janus_recordings:/mnt/janus-recordings:ro
    restart: unless-stopped

  collabora:
    image: git.omniindex.io:5050/omniindex/boudica-collabora/collabora:latest
    build:
      context: ./collabora
      args:
        COLLABORA_TAG: ${COLLABORA_TAG:-latest}
    # Loopback-only, always published regardless of proxy mode (bundled
    # nginx or an external one - see the nginx service's own comment below).
    # Harmless when nginx is doing the routing internally over the Docker
    # network instead - this is just an extra local access point, e.g. for
    # a host-level reverse proxy or for debugging via curl from the host.
    ports:
      - "127.0.0.1:${BOUDICA_COLLABORA_LOCAL_PORT:-8083}:9980"
    environment:
      # "first" mode (implicit trust-on-first-connect) matches the live
      # deployment's current WOPI trust model - see RUNBOOK.md's coolwsd.xml.
      # A real allowlist (aliasgroup1) is the safer option; left as an env
      # var so tightening this later doesn't require an image change.
      aliasgroup1: https://${BOUDICA_DOMAIN}:${BOUDICA_HTTPS_PORT:-443}
      DONT_GEN_SSL_CERT: "true"
      # --o:mount_jail_tree=false (2026-09-11): this container runs
      # unprivileged with no added capabilities (correctly - SYS_ADMIN is
      # close to a full container-escape-capable capability, not something
      # to grant for this). coolwsd's default mount_jail_tree=true needs
      # its own `coolmount` helper to bind-mount each child process's jail,
      # which requires CAP_SYS_ADMIN; without it every mount attempt fails
      # ("Failed to exec coolmount... needs CAP_SYS_ADMIN", confirmed live,
      # both here and on ts-1-boudica, in collabora-collabora-1's own
      # logs) - including the mount used to hand a just-uploaded local file
      # into a document's Insert Image/File dialog, which is what actually
      # surfaces to a user as "Uploading file to server failed, file not
      # found." coolwsd's own error text names this exact env var as the
      # supported alternative: falls back to copying/linking files into
      # the jail instead of mounting them, slower per the upstream docs
      # but doesn't need the capability at all.
      extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:mount_jail_tree=false
      # coolwsd's own default CSP (style-src 'self';) blocks the widget's
      # dynamically-injected <style> tag outright - confirmed live the
      # widget's JS/HTML loaded fine but every rule in it was silently
      # dropped by the browser, no console error. This is its own,
      # separate, directly-supported env var (NOT one of the
      # space-separated flags inside extra_params, which was tried first
      # and silently failed - extra_params gets naively split on
      # whitespace, so a value containing its own spaces, like a CSP
      # directive, breaks). coolwsd merges this into its built-in default
      # per-directive rather than replacing the whole policy (confirmed:
      # the resulting header has 'self' 'self' 'unsafe-inline' - harmless
      # duplicate, not a sign anything is wrong).
      content_security_policy: style-src 'self' 'unsafe-inline';
    depends_on: [nextcloud]
    volumes:
      # This bind mount was already correct - the actual bug (found
      # 2026-09-05) was upstream of it: .env's BOUDICA_API_ENDPOINT was
      # stale (predated the "Nextcloud as front door" fix), and setup.sh
      # silently discarded any corrected value typed at its prompt on a
      # re-run (source .env clobbered it - see that fix in setup.sh), so
      # this correctly-working mount kept faithfully serving a correctly-
      # rendered file with the wrong endpoint baked in.
      - ./generated/collabora/boudica-config.js:/usr/share/coolwsd/browser/dist/boudica-config.js:ro
    restart: unless-stopped

  janus:
    # Unlike the other 3 built services, this one had no `image:` tag at
    # all until now - fine for a local `docker compose build`, but a
    # pull-only deployment (e.g. ts-1-boudica, source-never-leaves-the-
    # build-machine policy - see project-myboudica-integration-plan-20260905
    # Phase 6) needs a real registry path to pull from, same as
    # nextcloud/collabora/signaling below.
    image: git.omniindex.io:5050/omniindex/boudica-collabora/janus:latest
    build:
      context: ../../vendor/nextcloud-spreed-signaling/docker/janus
    # Janus does a startup self-test STUN request against the configured
    # TURN server and treats no response as fatal, exiting immediately -
    # confirmed live (crash-looped until eturnal was actually up and
    # healthy). Waits on eturnal's healthcheck specifically, not just
    # container start - a plain depends_on only guarantees the container
    # process began, not that its TURN listener is actually bound yet.
    depends_on:
      eturnal:
        condition: service_healthy
    # Lets Janus reach its own host (where eturnal actually listens, via
    # `network_mode: host`) without going through the box's real public IP
    # - see janus.jcfg's own comment on why that specifically fails via
    # hairpin NAT on a box like ts-1-boudica where the public IP isn't
    # bound to a local interface.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./generated/janus/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro
      - janus_recordings:/opt/janus/share/janus/recordings
    restart: unless-stopped

  signaling:
    image: git.omniindex.io:5050/omniindex/boudica-collabora/signaling:latest
    build:
      context: ../../vendor/nextcloud-spreed-signaling
      dockerfile: ../../product_templates/collabora/signaling/Dockerfile
    depends_on: [janus]
    volumes:
      - ./generated/signaling/server.conf:/config/server.conf:ro
    # Loopback-only, always published (see the nginx service's own comment
    # below). Deliberately a distinct host-side port from the container's
    # own 8081 (set in server.conf's [http] listen) - 8081 is already taken
    # on a box running boudica_slm's own multiuser stack (its Keycloak's
    # loopback binding), and host-side ports are a completely separate
    # namespace from container-internal ones regardless.
    ports:
      - "127.0.0.1:${BOUDICA_SIGNALING_LOCAL_PORT:-8084}:8081"
    restart: unless-stopped

  eturnal:
    image: eturnal/eturnal:latest
    network_mode: host
    volumes:
      - ./generated/eturnal/eturnal.yml:/etc/eturnal.yml:ro
    restart: unless-stopped

  # No whisper service here either - shares boudica_slm's instance (service
  # name `whisper`, port 5000, reachable via `boudica_shared`), which is
  # also the more complete of the two copies (a real VAD empty-sequence
  # bug fix this repo's own copy lacked). boudicaai's own Whisper
  # integration (TranscriptionService.php) was never actually wired up in
  # this stack even before this change - whisper_service_url defaulted to
  # null - setup.sh now sets it to the shared instance, fixing that
  # pre-existing gap in the same pass.

  mail:
    # Lightweight relay only - real outbound delivery/sender verification is
    # external (Gmail/Workspace SMTP relay, or SendGrid/similar), same as
    # the native deployment. This container's only job is giving Nextcloud
    # a local SMTP hop that's up before Nextcloud is (native Postfix's own
    # boot-order bug, RUNBOOK.md 4.6, doesn't exist here since compose
    # brings services up in dependency order rather than racing systemd
    # units at host boot).
    # RELAYHOST_USERNAME/PASSWORD were missing entirely until 2026-09-08 -
    # boky/postfix supports an authenticated upstream relay (needed for
    # Gmail, which refuses unauthenticated relaying) but nothing here ever
    # passed the credentials through, so RELAYHOST alone silently produced
    # an unauthenticated connection Gmail would reject. Empty by default
    # (a relay with no auth, e.g. an internal mail gateway, still works
    # with these unset).
    image: boky/postfix:latest
    environment:
      # Space-separated - both this box's own domain (any future sender
      # that legitimately uses it) and MAIL_FROM_DOMAIN (setup.sh, derived
      # from SMTP_RELAYHOST_USERNAME - the actual sender Nextcloud uses
      # today when relaying through Gmail, see setup.sh's own comment).
      # Missing MAIL_FROM_DOMAIN here caused a real, confirmed-live outage
      # (2026-09-08): Postfix's check_sender_access rejected every message
      # with "554 5.7.1 Recipient address rejected: Access denied" - the
      # message is misleading, this check is actually keyed on the
      # *sender's* domain, not the recipient's.
      ALLOWED_SENDER_DOMAINS: ${BOUDICA_DOMAIN} ${MAIL_FROM_DOMAIN:-}
      RELAYHOST: ${SMTP_RELAYHOST:-}
      RELAYHOST_USERNAME: ${SMTP_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${SMTP_RELAYHOST_PASSWORD:-}
    restart: unless-stopped

  whiteboard:
    image: ghcr.io/nextcloud/whiteboard:release
    environment:
      NEXTCLOUD_URL: https://${BOUDICA_DOMAIN}
      JWT_SECRET_KEY: ${WHITEBOARD_JWT_SECRET}
    # Loopback-only, always published (see the nginx service's own comment
    # below).
    ports:
      - "127.0.0.1:${BOUDICA_WHITEBOARD_LOCAL_PORT:-8085}:3002"
    restart: unless-stopped

  # profiles: ["bundled-proxy"] - this service is this stack's OWN
  # TLS-terminating reverse proxy, for a box with no pre-existing one (a
  # sovereign/on-prem trial, or this dev box). A deployment that already
  # runs a host-level reverse proxy in front of its public domain (e.g.
  # ts-1-boudica's Apache, already fronting boudi.ca/boudica.myboudica.com -
  # see project-myboudica-integration-plan-20260905's Phase 1) does NOT
  # start this service at all - that host proxy gains its own ProxyPass/
  # vhost blocks pointing at the loopback ports published above instead
  # (nextcloud/collabora/signaling/whiteboard), avoiding a redundant second
  # reverse-proxy hop and a second place to manage TLS certs.
  #
  # setup.sh writes `COMPOSE_PROFILES=bundled-proxy` into .env for the
  # self-contained case (the default) so plain `docker compose up/down/ps`
  # commands keep including this service automatically with no flags to
  # remember - Compose reads COMPOSE_PROFILES from .env on its own. The
  # external-proxy case leaves it unset, so this service is excluded by
  # default from every compose command in that directory.
  nginx:
    image: nginx:latest
    profiles: ["bundled-proxy"]
    depends_on: [nextcloud, collabora, signaling, whiteboard]
    volumes:
      - ./generated/nginx:/etc/nginx/conf.d:ro
      - ${BOUDICA_TLS_CERT_DIR:-./generated/nginx/certs}:/etc/nginx/certs:ro
    # Same port number on both sides of the colon deliberately, not the
    # usual "hostport:containerport" translation - see the nginx config's
    # own note on why (Nextcloud's server-side HPB connectivity check hits
    # this container from the *inside* of the Docker network, where only
    # the container's real listening port exists at all - Docker's
    # host-side port-publish translation is a NAT rule the host applies,
    # it isn't reachable via the internal network namespace another
    # container lives in).
    ports:
      - "${BOUDICA_HTTP_PORT:-80}:${BOUDICA_HTTP_PORT:-80}"
      - "${BOUDICA_HTTPS_PORT:-443}:${BOUDICA_HTTPS_PORT:-443}"
    # Network aliases so any container on this network (Nextcloud, in
    # particular) can resolve the public hostnames straight to this
    # container via Docker's built-in DNS. Needed because Nextcloud Talk's
    # own admin-panel "High-performance backend" check connects to the
    # signaling URL server-side (from inside the nextcloud container, not
    # the browser) - confirmed live it failed with "Cannot connect to
    # server" / curl exit 6 "Couldn't resolve host", since nothing on the
    # Docker network otherwise knows what talk.<domain> even is.
    networks:
      default:
        aliases:
          - ${BOUDICA_DOMAIN}
          - talk.${BOUDICA_DOMAIN}
          - whiteboard.${BOUDICA_DOMAIN}
    restart: unless-stopped

networks:
  # Named + external so boudica_slm's own product_templates/multiuser
  # compose project (a separate repo, separate `docker compose` project)
  # resolves to this exact same underlying network - Nextcloud is the
  # shared front door for both products, with one Postgres and one Whisper
  # serving both rather than each product running its own. Created
  # idempotently by either product's setup.sh:
  # `docker network inspect boudica_shared >/dev/null 2>&1 || docker
  # network create boudica_shared`.
  default:
    name: boudica_shared
    external: true

volumes:
  redis_data:
  nextcloud_data:
  janus_recordings:
